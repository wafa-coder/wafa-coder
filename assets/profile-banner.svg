  <circle cx="1030" cy="72" r="175" fill="#34d399" opacity=".09"/>
  <circle cx="1090" cy="276" r="152" fill="#2dd4bf" opacity=".12"/>
  <path d="M850 300 1110 40M930 300 1190 40M1010 300 1270 40" stroke="#a7f3d0" stroke-opacity=".16" stroke-width="2"/>
  <rect x="82" y="77" width="10" height="146" rx="5" fill="url(#accent)"/>
  <text x="122" y="144" fill="#f0fdfa" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1">WAFA</text>
  <text x="125" y="183" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4">FULL-STACK DEVELOPER</text>
  <text x="125" y="220" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing=".5">WEB APPLICATIONS  ·  APIs  ·  DATA</text>
